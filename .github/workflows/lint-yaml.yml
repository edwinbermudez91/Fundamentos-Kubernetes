name: 🔍 Validar Sintaxis YAML

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-yaml:
    name: Lint de archivos YAML
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐍 Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'

      - name: 📦 Instalar yamllint
        run: pip install yamllint

      - name: 🧪 Validar sintaxis YAML
        run: |
          echo "Validando archivos YAML (excluyendo carpetas reto-roto y templates Helm)..."
          yamllint -c .yamllint.yml .

      - name: ⚓ Instalar Helm y validar Chart de Semana 06
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.17.1-linux-amd64.tar.gz | tar -xzf - -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          helm lint semana-06-helm/1.ejemplos/kubecafe-chart
          helm lint semana-06-helm/1.ejemplos/kubecafe-chart -f semana-06-helm/1.ejemplos/kubecafe-chart/values-prod.yaml
          helm template kubecafe-ci semana-06-helm/1.ejemplos/kubecafe-chart | yamllint -c .yamllint.yml -

      - name: ⚙️ Validar scripts y validadores del repositorio
        run: |
          node --check scripts/generar-asistentes.js
          node scripts/test-validadores.js
          bash -n scripts/verificar-reto.sh
